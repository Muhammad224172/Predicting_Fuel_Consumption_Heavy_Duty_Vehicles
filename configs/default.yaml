# Main experiment: same windows, features and target as the original project,
# evaluated with leakage-aware cross-validation.
#
#   * three outer CV schemes: shuffled KFold (original), GroupKFold by record
#     (trip) and GroupKFold by vehicle
#   * hyper-parameters tuned inside every outer training fold (nested CV); the
#     inner splitter follows the outer scheme
#   * a mean predictor and ridge regression as baselines
name: default
raw_dir: data/raw            # folder containing Record1.csv ... Record459.csv
processed_dir: data/processed
results_dir: results
seed: 42
n_jobs: 4

window:
  unit: rows                 # "rows" (original) or "seconds" (timestamp-based)
  size: 600                  # ~10 min at the median 1 s sampling interval
  step: 120                  # ~2 min; consecutive windows share 80% of their rows

outliers:
  iqr_k: 1.5
  columns: [fuel_per_weight, fuel_per_100km, EngTotalFuelUsed_range]

features:
  set: original              # original | no_median | all
  corr_top_k: null           # e.g. 30 to keep the 30 features most correlated with the target (fitted per fold)

models: [dummy, ridge, random_forest, xgboost]

cv:
  n_splits: 10
  inner_splits: 3            # 5 in the original's tuning step; 3 keeps nested CV affordable
  schemes: [kfold, group_record, group_vehicle]
  tuning: nested
